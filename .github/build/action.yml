# This action will build a .NET Windows Forms desktop application
# It must be executed from a job using windows-2025


name: Build
description: Builds the .NET Application
inputs:
  configuration:
    description: 'Build configuration: Debug or Release'
    required: true

  flavor:
    description: 'Build flavor: Installer or Portable'
    required: true

  solution_name:
    description: Solution file name
    required: false
    default: PasteIntoFile.sln

  project_directory:
    description: Project directory
    required: false
    default: PasteIntoFile

  build_options:
    description: Additional options passed to MSBuild
    required: false
    default: ''

  artifact:
    description: Name of build artifact to upload
    required: false
    default: ''

outputs:
  path:
    description: Build output path
    value: ${{ steps.build.outputs.path }}

  version:
    description: Program version
    value: ${{ steps.build.outputs.version }}

  artifact-id:
    description: Build output artifact ID
    value: ${{ steps.upload.outputs.artifact-id }}

runs:
  using: composite
  steps:
    ## Install the .NET Core workload
    ## This is not required since the windows-2025 runner comes with pre-installed .NET Framework
    #- name: Install .NET Core
    #  uses: actions/setup-dotnet@v4
    #  with:
    #    dotnet-version: 5.0.x

    # Add MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    # Build the app (after restoring dependencies)
    - name: Build
      id: build
      shell: pwsh
      run: |
        msbuild "${{ inputs.solution_name }}" /restore /p:Configuration=${{ inputs.configuration }} /p:Flavor=${{ inputs.flavor }} ${{ inputs.build_options }}
        $outputPath = "${{ inputs.project_directory }}\bin\${{ inputs.configuration }}"
        Copy-Item -LiteralPath LICENSE -Destination $outputPath
        $exe = Get-ChildItem -LiteralPath $outputPath -Filter '*.exe' | Select-Object -First 1
        if (-not $exe) { throw "No executable found in $outputPath" }
        $version = $exe.VersionInfo.ProductVersion
        Add-Content -Path $env:GITHUB_OUTPUT -Value "path=$outputPath"
        Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"

    # Upload build artifacts if requested
    - name: Upload build artifacts
      id: upload
      if: ${{ inputs.artifact != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact }}
        path: ${{ steps.build.outputs.path }}
